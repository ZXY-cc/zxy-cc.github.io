<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 星梦Staream</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#39436a;--muted:#525d84;--line:#e5eaf7;--brand:#3f5c9c}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#dceafb,#eae6fb 46%,#fdeef5);color:var(--ink);font:15.5px/1.9 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:36px 22px 70px}
.crumb{font-size:13px;color:var(--muted);margin:0 0 18px}
.crumb a{color:var(--brand);text-decoration:none}
article{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:16px;padding:32px 36px;box-shadow:0 10px 30px rgba(112,138,190,.10)}
h1{font-size:27px;margin:0 0 8px;letter-spacing:.5px}
.meta{color:var(--muted);font-size:13px;margin:0 0 26px}
h2{font-size:22px;margin:34px 0 14px}
.zb-vl{border-left:3px solid transparent;border-image:linear-gradient(180deg,#7897dc,#ab8bd4,#e096bd) 1;padding-left:13px}
.zb-vl>:first-child{margin-top:0}.zb-vl>:last-child{margin-bottom:0}
h3{font-size:17px;margin:24px 0 10px}
p{margin:0 0 18px}
strong{color:var(--ink)}
code{background:#eef3ff;border-radius:5px;padding:1px 6px;font-size:13px}
pre{background:#eef3ff;border-radius:10px;padding:16px;overflow:auto;font-size:13px;line-height:1.7}
blockquote{margin:20px 0;padding:12px 18px;border-left:3px solid var(--brand);background:#eef3ff;border-radius:0 10px 10px 0}
table{width:100%;border-collapse:collapse;margin:22px 0;font-size:14px;background:rgba(255,255,255,.5)}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:center}
th{background:#eef3ff}
ul,ol{padding-left:22px}
a{color:var(--brand)}
.back{margin:24px 0 0;font-size:14px}
@media (max-width:640px){.wrap{padding:20px 12px 48px}article{padding:22px 18px}h1{font-size:23px}}

/* 公式排版：站点文章、创作台预览、无 JS 静态镜像共用这一段，
   build.mjs 会原样抽进 posts/*.html 的内联样式。 */
/* Computer Modern Unicode（SIL OFL 1.1，随站点自带，许可见 assets/fonts/OFL.txt）。
   用根相对路径，主站样式表与 posts/ 下的静态页内联样式都能取到同一份字体。 */
@font-face {
  font-family: "ZB Computer Modern";
  src: url("/assets/fonts/cmu-serif-500-roman.woff2") format("woff2");
  font-style: normal; font-weight: 400; font-display: swap;
}
@font-face {
  font-family: "ZB Computer Modern";
  src: url("/assets/fonts/cmu-serif-500-italic.woff2") format("woff2");
  font-style: italic; font-weight: 400; font-display: swap;
}
.zb-math { font-family: "ZB Computer Modern", "Computer Modern Serif", "CMU Serif",
  "Latin Modern Roman", "Cambria Math", "Times New Roman", Georgia,
  var(--font-cn, "PingFang SC", "Microsoft YaHei", sans-serif), serif;
  line-height: 1.55; color: var(--ink-strong, #39436a); }
/* 设置页选「默认」时回到系统数学字体；静态镜像无该属性，始终用 Computer Modern */
:root[data-font-tex="default"] .zb-math { font-family: "Cambria Math", "Times New Roman",
  Georgia, var(--font-cn, "PingFang SC", "Microsoft YaHei", sans-serif), serif; }
/* 表格单元格里的公式（含 $$…$$ 写法）显式钉住同一套字体栈：
   单元格有自己的小字号与通用排版，不能让公式回落到正文默认字体。 */
th .zb-math, td .zb-math, .zb-mcell .zb-math {
  font-family: "ZB Computer Modern", "Computer Modern Serif", "CMU Serif",
  "Latin Modern Roman", "Cambria Math", "Times New Roman", Georgia,
  var(--font-cn, "PingFang SC", "Microsoft YaHei", sans-serif), serif;
  font-size: 1.08em;
}
:root[data-font-tex="default"] th .zb-math,
:root[data-font-tex="default"] td .zb-math,
:root[data-font-tex="default"] .zb-mcell .zb-math {
  font-family: "Cambria Math", "Times New Roman", Georgia,
  var(--font-cn, "PingFang SC", "Microsoft YaHei", sans-serif), serif;
}
.zb-math-inline { display: inline; }
.zb-math-block { display: block; margin: 22px 0; padding: 15px 18px; overflow-x: auto;
  text-align: center; font-size: 18px; border-radius: 14px;
  border: 1px solid var(--glass-line, rgba(255, 255, 255, .72));
  background: var(--code-bg, rgba(255, 255, 255, .30)); }
.zb-var { font-style: italic; }
.zb-digit, .zb-num, .zb-text, .zb-textchar, .zb-func, .zb-sym { font-style: normal; }
.zb-op { margin: 0 .1em; }
.zb-frac { display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: middle; margin: 0 .18em; font-size: .92em; line-height: 1.2; }
.zb-frac > .zb-num { display: block; padding: 0 .3em .08em; border-bottom: 1px solid currentColor; }
.zb-frac > .zb-den { display: block; padding: .08em .3em 0; }
.zb-binom .zb-frac > .zb-num { border-bottom: none; }
.zb-sqrt { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 .1em; }
.zb-radical { font-size: 1.25em; line-height: 1; }
.zb-radicand { border-top: 1px solid currentColor; padding: .06em .18em 0 .06em; }
.zb-root-deg { font-size: .62em; align-self: flex-start; margin-right: -.25em; }
.zb-script { display: inline-flex; align-items: stretch; vertical-align: middle; }
.zb-base { display: inline-flex; align-items: center; }
.zb-scripts { display: inline-flex; flex-direction: column; justify-content: center;
  font-size: .68em; line-height: 1.05; margin-left: .05em; }
.zb-sup, .zb-sub { display: block; min-height: .7em; }
.zb-bigop { display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: middle; margin: 0 .16em; line-height: 1.05; }
.zb-bigop > .zb-op { font-size: 1.7em; }
.zb-bigop .zb-over, .zb-bigop .zb-under { font-size: .66em; }
.zb-bb { font-weight: 700; }
.zb-bold { font-weight: 700; }
.zb-cal { font-family: "Segoe Script", "Brush Script MT", cursive; }
.zb-quad { display: inline-block; width: 1em; }
.zb-qquad { display: inline-block; width: 2em; }
.zb-thinspace { display: inline-block; width: .17em; }
.zb-nbsp { display: inline-block; width: .3em; }
.zb-delim { font-size: 1.12em; }
.zb-unknown { font-style: normal; color: #b0456b; }
.zb-group { display: inline; }
.zb-accent { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.zb-accent-mark { font-size: .7em; height: .55em; }
.zb-accent-underline { flex-direction: column-reverse; }
.zb-aligned { display: inline-flex; flex-direction: column; align-items: center; gap: .35em; }
.zb-line, .zb-cell { display: inline-flex; }
.zb-mtable { display: inline-flex; flex-direction: column; }
.zb-mrow { display: inline-flex; }
.zb-mcell { padding: .1em .4em; text-align: center; }
.zb-matrix { display: inline-flex; align-items: center; vertical-align: middle; }
.zb-matrix-pmatrix::before, .zb-matrix-pmatrix::after { font-size: 1.8em; }
.zb-matrix-pmatrix::before { content: '('; }
.zb-matrix-pmatrix::after { content: ')'; }
.zb-matrix-bmatrix::before { content: '['; font-size: 1.8em; }
.zb-matrix-bmatrix::after { content: ']'; font-size: 1.8em; }
.zb-matrix-cases::before { content: '\7B'; font-size: 2em; }
.zb-break { display: block; height: 0; }
.zb-alignmark { display: inline-block; width: .5em; }
.zb-task { margin-right: 7px; color: var(--accent-text, #3f5c9c); }
.zb-task.done { color: var(--accent-3-text, #934268); }
.zb-code .zb-lang { position: absolute; right: 12px; bottom: 7px; font-size: 10px;
  letter-spacing: .8px; color: var(--faint, #64708f); pointer-events: none; }
:root[data-theme="night"] .zb-math { color: #e8f0ff; }
:root[data-theme="night"] .zb-unknown { color: #ffb0c8; }
/* 代码语法配色：参考 Woodfish-Theme（Woodfish Dark，即 Bearded Theme Arc）。
   夜空直接用原版色值；晴空底色是雾白玻璃，同色相加深保证可读。
   低画质不上色：全部 token 回退为正文颜色（只动 color，不需重渲染）。 */
:root {
  --syn-cm: #6d7fa8; --syn-st: #0d9e5a; --syn-kw: #9a7c17; --syn-ty: #0b98a3;
  --syn-nu: #bf5a1d; --syn-cs: #bc3d16; --syn-fn: #1972c2; --syn-cls: #8a4ed6; --syn-pr: #b3541b;
}
:root[data-theme="night"] {
  --syn-cm: #4a5e84; --syn-st: #3cec85; --syn-kw: #eacd61; --syn-ty: #22ecdb;
  --syn-nu: #ff955c; --syn-cs: #e35535; --syn-fn: #69c3ff; --syn-cls: #b78aff; --syn-pr: #ff955c;
}
pre code .tk-cm { color: var(--syn-cm); font-style: italic; }
pre code .tk-st { color: var(--syn-st); }
pre code .tk-kw { color: var(--syn-kw); }
pre code .tk-ty { color: var(--syn-ty); }
pre code .tk-nu { color: var(--syn-nu); }
pre code .tk-cs { color: var(--syn-cs); }
pre code .tk-fn { color: var(--syn-fn); }
pre code .tk-cls { color: var(--syn-cls); }
pre code .tk-pr { color: var(--syn-pr); }
:root[data-quality="low"] pre code span[class^="tk-"] { color: inherit; font-style: normal; }
/* 代码字体：主站由 :root 定义 --font-code；静态镜像无该变量时回退到 Maple 默认栈 */
pre, pre > code, .article :not(pre) > code {
  font-family: var(--font-code, "JetBrains Maple Mono", "Maple Mono NF CN", "Maple Mono SC CN", "Maple Mono SC", "JetBrains Mono", ui-monospace, Consolas, "Liberation Mono", monospace);
}

</style>
</head>
