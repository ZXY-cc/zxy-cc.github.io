name: 留言归档同步
# 访客在 GitHub Issues 留言 / 回复 / 点赞后即时同步，另有每日兜底与手动入口。
# 只用到 GitHub 自带的 GITHUB_TOKEN，不需要任何外部服务、数据库或付费托管。
on:
  issues:
    types: [opened, edited, reopened, closed, deleted, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: comment-archive
  cancel-in-progress: true
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 同步 Issues 留言到仓库归档
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/sync-issues.mjs
      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comments.json assets/comments-data.js posts/*.html
          if git diff --cached --quiet; then
            echo "留言归档无变化"
          else
            git commit -m "chore: 同步 GitHub Issues 留言归档"
            git push
          fi
