<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸上留白</title>
<meta name="description" content="一个关于技术、算法与日常记录的个人博客">
<meta name="theme-color" content="#dceafb">
<link rel="icon" href="assets/avatar.jpg">
<link rel="apple-touch-icon" href="assets/avatar.jpg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- 图形精灵：全站只用一种圆角五角星；另有花瓣 / 小白花 / 樱粉心 -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="puffy-star" viewBox="0 0 100 100">
    <path d="M 44.3 14.0 Q 50.0 6.0 55.7 14.0 L 61.1 21.5 Q 65.9 28.2 73.7 30.6 L 82.5 33.4 Q 91.8 36.4 86.0 44.3 L 80.5 51.8 Q 75.7 58.3 75.7 66.5 L 75.8 75.8 Q 75.9 85.6 66.6 82.5 L 57.8 79.6 Q 50.0 77.0 42.2 79.6 L 33.4 82.5 Q 24.1 85.6 24.2 75.8 L 24.3 66.5 Q 24.3 58.3 19.5 51.8 L 14.0 44.3 Q 8.2 36.4 17.5 33.4 L 26.3 30.6 Q 34.1 28.2 38.9 21.5 L 44.3 14.0 Z"/>
  </symbol>
  <symbol id="petal" viewBox="0 0 100 100">
    <path d="M 50 4 C 78 16 90 44 50 94 C 10 44 22 16 50 4 Z"/>
  </symbol>
  <symbol id="bloom" viewBox="0 0 100 100">
    <g fill="#ffffff" fill-opacity=".78">
      <ellipse cx="50" cy="30" rx="15" ry="21"/>
      <ellipse cx="50" cy="30" rx="15" ry="21" transform="rotate(72 50 50)"/>
      <ellipse cx="50" cy="30" rx="15" ry="21" transform="rotate(144 50 50)"/>
      <ellipse cx="50" cy="30" rx="15" ry="21" transform="rotate(216 50 50)"/>
      <ellipse cx="50" cy="30" rx="15" ry="21" transform="rotate(288 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="10" fill="#f6e4b8" fill-opacity=".55"/>
  </symbol>
  <symbol id="soft-heart" viewBox="0 0 100 100">
    <path d="M 50 88 C 12 62 6 38 24 26 C 38 17 47 26 50 34 C 53 26 62 17 76 26 C 94 38 88 62 50 88 Z"/>
  </symbol>
</svg>

<div class="sky" aria-hidden="true">
  <div class="sky-base"></div>
  <div class="wash wash-blue"></div>
  <div class="wash wash-pink"></div>
  <div class="wash wash-cream"></div>
  <div class="sunbeam"></div>
  <div class="haze haze-one"></div>
  <div class="haze haze-two"></div>
  <div class="warm-mist"></div>
  <div class="gold-mist"></div>
  <div class="frost"></div>

  <div class="blooms">
    <svg class="sky-deco bloom" viewBox="0 0 100 100" style="left:6%;top:11%;width:76px"><use href="#bloom"/></svg>
    <svg class="sky-deco bloom" viewBox="0 0 100 100" style="right:9%;top:33%;width:54px"><use href="#bloom"/></svg>
    <svg class="sky-deco bloom" viewBox="0 0 100 100" style="left:14%;bottom:13%;width:62px"><use href="#bloom"/></svg>
    <svg class="sky-deco heart" viewBox="0 0 100 100" style="right:17%;top:9%;width:38px"><use href="#soft-heart"/></svg>
    <svg class="sky-deco heart" viewBox="0 0 100 100" style="left:33%;top:57%;width:28px"><use href="#soft-heart"/></svg>
    <svg class="sky-deco heart" viewBox="0 0 100 100" style="right:6%;bottom:19%;width:44px"><use href="#soft-heart"/></svg>
    <svg class="sky-deco sparkle" viewBox="0 0 100 100" style="left:47%;top:8%;width:22px"><use href="#puffy-star"/></svg>
    <svg class="sky-deco sparkle" viewBox="0 0 100 100" style="right:28%;bottom:28%;width:18px"><use href="#puffy-star"/></svg>
  </div>

  <div class="petals" id="petals"></div>
  <div class="stars" id="stars"></div>
  <div class="meteors">
    <span class="meteor meteor-a"></span>
    <span class="meteor meteor-b"></span>
    <span class="meteor meteor-c"></span>
  </div>
  <!-- 偶尔掠过的流星：从右上到左下，头部出屏后才熄灭；光迹右端接头部、只留在走过的后方 -->
  <div class="shoots">
    <span class="shoot shoot-a"></span>
    <span class="shoot shoot-b"></span>
    <span class="shoot shoot-c"></span>
  </div>
  <!-- 星夜才亮起的流萤 -->
  <div class="fireflies">
    <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
    <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
  </div>
</div>

<div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>
<div class="reading-progress" id="reading-progress" aria-hidden="true"></div>

<div class="wrap">
  <!-- 最上面一栏：品牌 + 导航 + 主题切换 -->
  <header class="site-head glass">
    <div class="head-bar">
      <div class="brand-wrap">
        <img class="avatar avatar-brand" src="assets/avatar.jpg" alt="站长头像">
        <div class="site-title"><a href="#/" id="brand">纸上留白</a></div>
      </div>
      <nav class="nav">
        <a href="#/" data-nav="home">文章</a>
        <a href="#/timeline" data-nav="timeline">归档</a>
        <a href="#/projects" data-nav="projects">项目</a>
        <a href="#/photowall" data-nav="photowall">照片墙</a>
        <a href="#/moments" data-nav="moments">说说</a>
        <a href="#/chatter" data-nav="chatter">杂谈</a>
        <a href="#/friends" data-nav="friends">友链</a>
        <a href="#/tags" data-nav="tags">标签</a>
        <a href="#/about" data-nav="about">关于</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换为星夜模式" title="切换为星夜模式"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.7 8.7 0 1 0 10.7 10.7Z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <!-- 第二栏：搜索独占整行 -->
  <label class="search-bar glass" for="search" role="search">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5 21 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="搜索文章、杂谈、说说、项目与相册" autocomplete="off" aria-label="全站搜索">
    <span class="search-tip" aria-hidden="true">全站检索</span>
  </label>

  <main id="app" aria-live="polite"></main>

  <footer class="site-foot glass">
    <span id="foot-left"></span>
    <span id="foot-note">纯静态 · 无追踪 · 无依赖</span>
    <span class="uptime" id="uptime"></span>
    <span class="owner-door" id="owner-door" title="✦" aria-hidden="true">✦</span>
  </footer>
</div>

<button class="to-top" id="to-top" type="button" aria-label="回到顶部" title="回到顶部">
  <span class="puffy-mark" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#puffy-star"/></svg></span>
</button>

<!-- 图片灯箱 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片查看器">
  <span class="lb-backdrop"></span>
  <button class="lb-btn lb-close" type="button" data-lb="close" aria-label="关闭">×</button>
  <button class="lb-btn lb-prev" type="button" data-lb="prev" aria-label="上一张">‹</button>
  <img class="lb-img" id="lb-img" src="" alt="">
  <button class="lb-btn lb-next" type="button" data-lb="next" aria-label="下一张">›</button>
  <div class="lb-cap"><span id="lb-title"></span><i id="lb-note"></i><span id="lb-index"></span></div>
</div>

<!-- 启动闪屏：每个浏览会话只出现一次 -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-inner">
    <svg class="splash-star" viewBox="0 0 100 100"><use href="#puffy-star"/></svg>
    <span class="splash-name">纸 上 留 白</span>
    <span class="splash-note">把想法写下来，才算真的想过</span>
  </div>
</div>

<script src="assets/posts.js"></script>
<script src="assets/site-data.js"></script>
<script src="assets/studio.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
